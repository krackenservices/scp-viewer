services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/scpviewer
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:7474" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./packages/api
    ports:
      - "4000:4000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=scpviewer
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:4000/health" ]
      interval: 5s
      timeout: 3s
      retries: 5

  viewer:
    build: ./packages/viewer
    ports:
      - "3000:80"
    depends_on:
      - api
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80 || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 5

  scanner:
    image: ghcr.io/krackenservices/scp-constructor:latest
    command: [ "scp-cli", "scan", "/data", "--export", "neo4j" ]
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=scpviewer
    volumes:
      - ${V_DATA:-./data}:/data:ro
    depends_on:
      neo4j:
        condition: service_healthy
    profiles:
      - scan

  mcp:
    build: ./packages/mcp
    environment:
      - SCP_API_URL=http://api:4000
    depends_on:
      api:
        condition: service_healthy
    stdin_open: true
    tty: true
    profiles:
      - mcp

  # E2E test runner using Playwright
  e2e:
    build:
      context: ./packages/viewer
      dockerfile: Dockerfile.e2e
    volumes:
      - ./test-results:/app/test-results
    environment:
      - PLAYWRIGHT_TEST_BASE_URL=http://viewer:80
      - API_BASE_URL=http://api:4000
    depends_on:
      viewer:
        condition: service_healthy
      api:
        condition: service_healthy
    profiles:
      - test

volumes:
  neo4j_data:
  neo4j_logs:
