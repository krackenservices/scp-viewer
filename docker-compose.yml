services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/scpviewer
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./packages/api
    ports:
      - "4000:4000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=scpviewer
    depends_on:
      neo4j:
        condition: service_healthy

  viewer:
    build: ./packages/viewer
    ports:
      - "3000:80"
    depends_on:
      - api

  scanner:
    build: ./packages/scanner
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=scpviewer
      - SCAN_PATH=/data
    volumes:
      - ./data:/data:ro
    depends_on:
      neo4j:
        condition: service_healthy
    profiles:
      - scan

volumes:
  neo4j_data:
  neo4j_logs:
