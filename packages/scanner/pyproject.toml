[project]
name = "scp-viewer-scanner"
version = "0.1.0"
description = "Scanner agent for SCP Viewer - syncs SCP manifests to Neo4j"
requires-python = ">=3.12"
dependencies = [
    "scp-constructor>=0.1.0",
    "neo4j>=5.0",
]

[project.scripts]
scan = "scanner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-mock>=3.12.0",
]
